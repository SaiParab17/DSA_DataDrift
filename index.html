<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataWatch — Statistical Drift & Dataset Monitoring Platform</title>
  <meta name="description" content="DataWatch compares your reference and current datasets to detect statistical drift, identify affected features, and turn silent baseline erosion into clear, deterministic engineering signals." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface":               "#FAF7EE",
            "surface-card":          "#FFFDF8",
            "ink":                   "#111111",
            "brand-yellow":          "#FFE600",
            "brand-coral":           "#FF5277",
            "brand-green":           "#00D26A",
            "brand-gray":            "#E5E0D0",
            // M3-style tokens (used by Home / Analyze / Results screens)
            "on-surface":            "#1c1b1b",
            "on-surface-variant":    "#4b4731",
            "secondary":             "#003edb",
            "tertiary":              "#b81847",
            "tertiary-container":    "#ffdcdf",
            "primary":               "#6a5f00",
            "primary-container":     "#ffe600",
            "primary-fixed":         "#fde400",
            "secondary-container":   "#2958fe",
            "secondary-fixed":       "#dde1ff",
            "surface-container":     "#f0edec",
            "surface-container-low": "#f6f3f2",
            "surface-container-high":"#ebe7e7",
            "surface-container-highest":"#e5e2e1",
            "surface-container-lowest":"#ffffff",
            "surface-dim":           "#dcd9d9",
            "outline":               "#7c775f",
            "outline-variant":       "#cdc7aa",
            "on-primary":            "#ffffff",
            "on-secondary":          "#ffffff",
            "on-tertiary":           "#ffffff",
            "on-primary-fixed":      "#201c00",
            "on-primary-container":  "#726600",
            "on-secondary-container":"#eaebff",
            "on-secondary-fixed":    "#001356",
            "error":                 "#ba1a1a",
          },
          fontFamily: {
            display:  ["Space Grotesk", "sans-serif"],
            body:     ["Space Grotesk", "sans-serif"],
            mono:     ["JetBrains Mono", "monospace"],
            // Stitch token names
            "body-md":    ["Space Grotesk", "sans-serif"],
            "body-lg":    ["Space Grotesk", "sans-serif"],
            "headline-sm":["Space Grotesk", "sans-serif"],
            "headline-md":["Space Grotesk", "sans-serif"],
            "headline-lg":["Space Grotesk", "sans-serif"],
            "code-sm":    ["JetBrains Mono", "monospace"],
            "code-md":    ["JetBrains Mono", "monospace"],
            "code-lg":    ["JetBrains Mono", "monospace"],
            "label-caps": ["JetBrains Mono", "monospace"],
          },
          fontSize: {
            "display":     ["48px", { lineHeight:"52px", letterSpacing:"-0.03em", fontWeight:"700" }],
            "display-mobile":["32px",{ lineHeight:"36px", letterSpacing:"-0.02em", fontWeight:"700" }],
            "headline-lg": ["32px", { lineHeight:"36px", letterSpacing:"-0.02em", fontWeight:"700" }],
            "headline-md": ["22px", { lineHeight:"26px", letterSpacing:"-0.01em", fontWeight:"600" }],
            "headline-sm": ["18px", { lineHeight:"22px", letterSpacing:"0em",     fontWeight:"600" }],
            "body-lg":     ["16px", { lineHeight:"24px", fontWeight:"500" }],
            "body-md":     ["14px", { lineHeight:"20px", fontWeight:"400" }],
            "code-lg":     ["15px", { lineHeight:"22px", letterSpacing:"-0.01em", fontWeight:"600" }],
            "code-md":     ["13px", { lineHeight:"18px", fontWeight:"500" }],
            "code-sm":     ["11px", { lineHeight:"16px", letterSpacing:"0.02em",  fontWeight:"500" }],
            "label-caps":  ["11px", { lineHeight:"14px", letterSpacing:"0.08em",  fontWeight:"700" }],
          },
          spacing: {
            "gutter":    "1.5rem",
            "gutter-sm": "1rem",
            "space-xl":  "2.5rem",
            "space-lg":  "1.5rem",
            "space-md":  "1rem",
            "space-sm":  "0.5rem",
            "space-xs":  "0.25rem",
            "margin":    "2rem",
            "margin-sm": "1rem",
          }
        }
      }
    };
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background-color: #FAF7EE; }
    body { overscroll-behavior: none; }
    ::-webkit-scrollbar { display: none; }
    /* Page transition */
    #app-root { transition: opacity 0.12s ease; }
    #app-root.fade-out { opacity: 0; }
  </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-fixed min-h-screen">
  <div id="app-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
